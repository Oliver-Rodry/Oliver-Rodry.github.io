name: Update catalog from Gmail

on:
  workflow_dispatch:
  schedule:
    # 6 PM America/Santo_Domingo (22:00 UTC), October 7-November 6, 2026.
    # A Gmail message already recorded in state is safely skipped.
    - cron: "0 22 7-31 10 *"
    - cron: "0 22 1-6 11 *"

permissions:
  contents: write
  pages: write

concurrency:
  group: catalog-and-social-automation
  cancel-in-progress: false

jobs:
  schedule-window:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.window.outputs.enabled }}
    steps:
      - name: Limit scheduled updates to the requested month
        id: window
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          today=$(TZ=America/Santo_Domingo date +%F)
          if [[ "$EVENT_NAME" == "workflow_dispatch" || ( "$today" > "2026-10-06" && "$today" < "2026-11-07" ) ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  update-catalog:
    needs: schedule-window
    if: needs.schedule-window.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/catalog-requirements.txt

      - name: Install workbook dependency
        run: python -m pip install --requirement .github/workflows/catalog-requirements.txt

      - name: Download and prepare latest inventory
        id: inventory
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
        run: python scripts/cloud_catalog_automation.py prepare

      - name: Commit and push catalog update
        if: steps.inventory.outputs.duplicate != 'true'
        run: |
          git config user.name "Catalog Automation"
          git config user.email "actions@users.noreply.github.com"
          git add products.csv .github/catalog-automation-state.json
          git diff --cached --quiet || git commit -m "Update catalog from inventory email $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Request website publication
        if: steps.inventory.outputs.duplicate != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"

      - name: Verify published inventory
        if: steps.inventory.outputs.duplicate != 'true'
        run: python scripts/verify_catalog.py

      - name: Send confirmation email
        if: steps.inventory.outputs.duplicate != 'true'
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
        run: python scripts/cloud_catalog_automation.py send

      - name: Record report delivery
        if: steps.inventory.outputs.duplicate != 'true'
        run: |
          git add .github/catalog-automation-state.json
          git diff --cached --quiet || git commit -m "Record catalog report delivery $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
